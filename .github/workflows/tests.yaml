name: Nuclearizer Tests for develop/em

on:
  push:
    branches:
      - develop/em
  pull_request:
    branches:
      - develop/em
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-24.04
            cxx: g++
            cc: gcc
            ccfits: ccfits=2.6
            coverage: 1
            timeout: 30
          - name: macOS
            os: macos-26
            cxx: clang++
            cc: clang
            # conda-forge has no CCfits for osx-arm64, it is built from source below
            ccfits: ""
            coverage: 0
            timeout: 60

    env:
      MEGALIB: ${{ github.workspace }}/megalib
      NUCLEARIZER: ${{ github.workspace }}

      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: true
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: true
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 1G
      CCACHE_SLOPPINESS: file_macro,time_macros,pch_defines

    steps:
      - name: Checkout Nuclearizer
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout MEGAlib
        uses: actions/checkout@v4
        with:
          repository: zoglauer/megalib
          ref: develop-cosi
          path: megalib

      - name: Setup Conda Environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: cosi-env
          condarc: |
            channels:
              - conda-forge
          create-args: >-
            root=6.32 geant4=11.2 healpix_cxx
            pkg-config make cmake cxx-compiler ccache
            ${{ matrix.ccfits }} cfitsio=4.3 hdf5=1.14 gcovr
          cache-environment: true
          cache-environment-key: micromamba-${{ runner.os }}-root6.32-geant4.11.2-ccfits2.6-cfitsio4.3-hdf5.1.14

      - name: Build CCfits
        if: runner.os == 'macOS'
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          if [ ! -f "$CONDA_PREFIX/lib/libCCfits.dylib" ]; then
            curl -fsSL https://heasarc.gsfc.nasa.gov/FTP/software/fitsio/ccfits/v2.6/CCfits-2.6.tar.gz | tar xz -C "$RUNNER_TEMP"
            cd "$RUNNER_TEMP/CCfits-2.6"
            # The config.sub of CCfits 2.6 does not know conda's arm64-apple-darwin20.0.0 from build_alias/host_alias
            ./configure --prefix="$CONDA_PREFIX" --with-cfitsio="$CONDA_PREFIX" --disable-static \
              --build=aarch64-apple-darwin20.0.0 --host=aarch64-apple-darwin20.0.0 CXX=${{ matrix.cxx }}
            make -j$(getconf _NPROCESSORS_ONLN) install
          fi

      - name: Write pkg-config files & sanity-check
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p "$CONDA_PREFIX/lib/pkgconfig"
          echo -e "prefix=$CONDA_PREFIX\nexec_prefix=\${prefix}\nlibdir=\${exec_prefix}/lib\nincludedir=\${prefix}/include\n\nName: hdf5\nDescription: HDF5\nVersion: 1.14\nLibs: -L\${libdir} -lhdf5_cpp -lhdf5\nCflags: -I\${includedir}" > "$CONDA_PREFIX/lib/pkgconfig/hdf5.pc"
          echo -e "prefix=$CONDA_PREFIX\nexec_prefix=\${prefix}\nlibdir=\${exec_prefix}/lib\nincludedir=\${prefix}/include\n\nName: CCfits\nDescription: CCfits\nVersion: 2.6\nLibs: -L\${libdir} -lCCfits -lcfitsio\nCflags: -I\${includedir}" > "$CONDA_PREFIX/lib/pkgconfig/CCfits.pc"
          export PKG_CONFIG_PATH="$CONDA_PREFIX/lib/pkgconfig:$CONDA_PREFIX/share/pkgconfig:${PKG_CONFIG_PATH:-}"
          pkg-config --print-errors --exists hdf5
          pkg-config --print-errors --exists CCfits
          pkg-config --libs --cflags hdf5 CCfits
          echo 'int main(){return 0;}' | ${{ matrix.cxx }} -x c++ - $(pkg-config --cflags --libs hdf5 CCfits) -o /tmp/pkgconfig-link-test

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.head_ref || github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Cache MEGAlib build
        id: cache-megalib
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/megalib/lib
            ${{ github.workspace }}/megalib/bin
            ${{ github.workspace }}/megalib/include
            ${{ github.workspace }}/megalib/config
          key: megalib-${{ runner.os }}-root6.32-geant4.11.2-cfitsio4.3-hdf5.1.14-${{ hashFiles('megalib/src/**/*.cxx', 'megalib/src/**/*.h', 'megalib/src/**/Makefile*', 'megalib/configure', 'megalib/Makefile*') }}

      - name: Configure build environment
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          {
            echo "PKG_CONFIG_PATH=$CONDA_PREFIX/lib/pkgconfig:$CONDA_PREFIX/share/pkgconfig:${PKG_CONFIG_PATH:-}"
            # Only used on Linux: on macOS the libraries are found via their absolute install names and the rpath from root-config
            echo "LD_LIBRARY_PATH=${{ github.workspace }}/lib:$MEGALIB/lib:$CONDA_PREFIX/lib:${LD_LIBRARY_PATH:-}"
            echo "LDFLAGS=-L$CONDA_PREFIX/lib -Wl,-rpath,$CONDA_PREFIX/lib ${LDFLAGS:-}"
            echo "CXX=ccache ${{ matrix.cxx }}"
            echo "CC=ccache ${{ matrix.cc }}"
          } >> "$GITHUB_ENV"

      - name: Build MEGAlib
        if: steps.cache-megalib.outputs.cache-hit != 'true'
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          cd $MEGALIB
          ./configure
          # config/Makefile.macosx hardcodes CXX/LD := c++ (Apple's clang from Xcode), which rejects the VecCore headers
          # bundled in conda's ROOT. Command-line variables override it in all sub-makes, so MEGAlib is built with the
          # same conda compiler as ROOT, Geant4, CCfits and Nuclearizer.
          make CXX="ccache ${{ matrix.cxx }}" CC="ccache ${{ matrix.cc }}" LD="${{ matrix.cxx }}" -j$(getconf _NPROCESSORS_ONLN)

      - name: Build Nuclearizer
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p ${{ github.workspace }}/lib ${{ github.workspace }}/bin
          ln -sf $MEGALIB/bin/generatelinkdef ${{ github.workspace }}/bin/generatelinkdef
          cd ${{ github.workspace }}
          make COVERAGE=${{ matrix.coverage }} CXX="ccache ${{ matrix.cxx }}" CC="ccache ${{ matrix.cc }}" LD="${{ matrix.cxx }}" LB=${{ github.workspace }}/lib BN=${{ github.workspace }}/bin -j$(getconf _NPROCESSORS_ONLN)

      - name: Copy Nuclearizer outputs into MEGAlib tree
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p $MEGALIB/lib $MEGALIB/bin
          rm -f "${{ github.workspace }}/bin/generatelinkdef"
          rsync -a --ignore-existing ${{ github.workspace }}/lib/ $MEGALIB/lib/
          rsync -a --ignore-existing ${{ github.workspace }}/bin/ $MEGALIB/bin/

      - name: Test Nuclearizer
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          cd $NUCLEARIZER
          export PATH=$MEGALIB/bin:$PATH
          find $MEGALIB/bin -name "*.gcda" -delete
          make unittests COVERAGE=${{ matrix.coverage }} CXX="ccache ${{ matrix.cxx }}" CC="ccache ${{ matrix.cc }}" LD="${{ matrix.cxx }}" LB=${{ github.workspace }}/lib BN=${{ github.workspace }}/bin -j$(getconf _NPROCESSORS_ONLN)
          ${{ github.workspace }}/bin/UTNRunner

      - name: ccache stats
        if: always()
        shell: micromamba-shell {0}
        run: ccache --show-stats || true

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-${{ matrix.name }}
          path: /tmp/*.log

      - name: Generate Coverage Report
        if: matrix.coverage == 1
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          gcovr -r . $MEGALIB/lib/ $MEGALIB/bin/ \
            --xml coverage.xml \
            --exclude '$NUCLEARIZER/apps/.*' \
            --exclude '$NUCLEARIZER/unittests/.*' \
            --exclude-throw-branches --exclude-unreachable-branches \
            --decisions \
            --gcov-delete \
            -j $(getconf _NPROCESSORS_ONLN)

      - name: Upload Report to Codecov
        if: matrix.coverage == 1
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true
